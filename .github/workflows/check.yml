name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scanner-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanner/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run check
