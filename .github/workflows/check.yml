name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanner/package.json
      - name: Install scanner dependencies
        working-directory: scanner
        run: npm install --no-audit --no-fund
      - name: Check scanner syntax
        working-directory: scanner
        run: npm run check
      - name: Opportunity risk gate synthetic check
        working-directory: scanner
        run: npm run risk-gate-check
      - name: Alert worker synthetic check
        working-directory: scanner
        run: npm run alert-check
      - name: History outcome synthetic check
        working-directory: scanner
        run: npm run history-check
      - name: Check alert setup script
        run: bash -n scanner/scripts/configure_alert_channels.sh
      - name: Robinhood RPC smoke test
        working-directory: scanner
        run: npm run smoke
      - name: Check V6.2 Apps Script syntax
        run: |
          cat apps-script/v6_2/*.gs > /tmp/v6_2_all.js
          node --check /tmp/v6_2_all.js
      - name: Check ingest Apps Script syntax
        run: |
          cp apps-script/rh_newcoin_ingest_v2.gs /tmp/ingest.js
          node --check /tmp/ingest.js
      - name: Build Railway Docker image
        run: docker build -t rh-chain-monitor:ci .
